<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Customer messages · Advantage Moving</title><link rel="stylesheet" href="/chat-assets/inbox.css"></head>
<body><header><div><span class="brand">A<span>★</span></span><div><h1>Customer messages</h1><p>Advantage Moving inbox</p></div></div><div class="top-actions"><span id="connection" role="status">Connecting…</span><button id="logout" type="button">Sign out</button></div></header><main><aside class="sidebar"><div class="list-head"><h2>Conversations</h2><span id="count" aria-label="Unread messages"></span></div><div id="conversations" role="listbox" aria-label="Conversations"><p class="empty">Loading…</p></div></aside><section class="thread" aria-label="Conversation"><div class="thread-head"><div><h2 id="thread-title">Select a conversation</h2><p id="thread-detail">New messages will appear here.</p></div><button type="button" id="close" hidden>Close conversation</button></div><div id="messages" role="log" aria-live="polite"><p class="empty">Choose a conversation on the left.</p></div><form id="reply" hidden><label class="sr" for="body">Your reply</label><textarea id="body" maxlength="2000" rows="2" placeholder="Type a response…" required></textarea><button type="submit">Send</button></form><p id="error" role="alert"></p></section></main><script src="/chat-assets/inbox.js" defer></script></body></html>
