<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <!-- one encaustic tile, drawn so neighbours join into a second motif at the corners -->
  <g fill="none" stroke="#b89a66" stroke-opacity=".10" stroke-width="1">
    <rect x=".5" y=".5" width="139" height="139"/>
  </g>
  <g fill="#b89a66" fill-opacity=".045">
    <!-- centre: four-petal flower -->
    <g transform="translate(70 70)">
      <ellipse rx="9" ry="26" transform="translate(0 -17)"/>
      <ellipse rx="9" ry="26" transform="translate(0 17)"/>
      <ellipse rx="26" ry="9" transform="translate(-17 0)"/>
      <ellipse rx="26" ry="9" transform="translate(17 0)"/>
    </g>
    <!-- corners: quarter rosettes -->
    <circle cx="0" cy="0" r="22"/><circle cx="140" cy="0" r="22"/><circle cx="0" cy="140" r="22"/><circle cx="140" cy="140" r="22"/>
  </g>
  <g fill="none" stroke="#b89a66" stroke-opacity=".08" stroke-width="1.2">
    <circle cx="70" cy="70" r="40"/>
    <circle cx="70" cy="70" r="6"/>
    <path d="M70 0v14M70 126v14M0 70h14M126 70h14"/>
  </g>
</svg>
