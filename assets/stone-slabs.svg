<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <!-- Large limestone slabs in an offset bond: faint mottling + hairline joints.
       stitchTiles keeps the noise seamless when the image repeats. -->
  <defs>
    <filter id="stone" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.016" numOctaves="4" seed="11" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.50  0 0 0 0 0.32  0 0 0 0.55 -0.2"/>
    </filter>
    <filter id="fleck" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="4" stitchTiles="stitch" result="f"/>
      <feColorMatrix in="f" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.30  0 0 0 1.6 -1.18"/>
    </filter>
  </defs>
  <rect width="720" height="480" filter="url(#stone)" opacity=".42"/>
  <rect width="720" height="480" filter="url(#fleck)" opacity=".35"/>
  <g stroke="#9c8152" stroke-opacity=".07" stroke-width="1" fill="none">
    <path d="M0 .5H720M0 240.5H720"/>
    <path d="M420.5 0V240M180.5 240V480M600.5 240V480"/>
  </g>
</svg>
